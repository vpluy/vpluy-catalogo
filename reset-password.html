<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>VPLuy · Restablecer contraseña</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,Helvetica,sans-serif;background:#eef6ff;color:#173b6b;padding:18px
    }
    .card{
      width:min(520px,100%);background:#fff;border:1px solid #c9dff3;border-radius:18px;
      box-shadow:0 18px 50px rgba(20,55,92,.14);padding:26px
    }
    h1{margin:0 0 8px;font-size:25px;color:#0753a8}
    p{line-height:1.45;color:#536b84}
    label{display:block;margin:14px 0 6px;font-weight:800;font-size:13px}
    input{
      width:100%;padding:13px 12px;border:1px solid #bcd3e8;border-radius:10px;
      font-size:16px
    }
    button{
      width:100%;margin-top:18px;border:0;border-radius:10px;padding:13px;
      background:#0d6efd;color:#fff;font-size:15px;font-weight:900;cursor:pointer
    }
    button:disabled{opacity:.55;cursor:not-allowed}
    .msg{margin-top:14px;padding:11px 12px;border-radius:10px;display:none;line-height:1.4}
    .ok{display:block;background:#eaf8ef;color:#087443;border:1px solid #bce3ca}
    .err{display:block;background:#fff0f0;color:#a52b31;border:1px solid #e6b9bd}
    .info{display:block;background:#eef6ff;color:#31577f;border:1px solid #c9dff3}
    .small{font-size:12px;color:#72859a;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>VPLuy · Nueva contraseña</h1>
    <p>Esta página se usa únicamente para completar la recuperación de la contraseña del administrador de Opiniones Automáticas.</p>

    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm">Repetir nueva contraseña</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>

      <button id="saveBtn" type="submit">Guardar nueva contraseña</button>
    </form>

    <div id="msg" class="msg"></div>
    <div class="small">Si el enlace venció, solicitá un correo de recuperación nuevo después de configurar correctamente la URL de redirección en Supabase.</div>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://ijevzecsdpsqzregyjjv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hMUWig5dqugv7I7y-lugHQ_FrMRfbuB";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });

    const form = document.getElementById("resetForm");
    const btn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");

    function show(text, type="info"){
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    async function prepareSession(){
      try{
        const url = new URL(window.location.href);
        const code = url.searchParams.get("code");
        if(code){
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if(error) throw error;
          history.replaceState({}, document.title, url.pathname);
        }

        const { data, error } = await supabase.auth.getSession();
        if(error) throw error;

        if(!data?.session){
          show("No hay una sesión de recuperación válida. Si abriste un enlace viejo, pedí un correo de recuperación nuevo.", "err");
          btn.disabled = true;
        }else{
          show("Enlace válido. Ya podés crear la nueva contraseña.", "info");
        }
      }catch(e){
        show("No se pudo validar el enlace de recuperación: " + (e?.message || e), "err");
        btn.disabled = true;
      }
    }

    supabase.auth.onAuthStateChange((event) => {
      if(event === "PASSWORD_RECOVERY"){
        btn.disabled = false;
        show("Enlace de recuperación validado. Escribí la nueva contraseña.", "info");
      }
    });

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if(password.length < 8){
        show("La contraseña debe tener al menos 8 caracteres.", "err");
        return;
      }
      if(password !== confirm){
        show("Las dos contraseñas no coinciden.", "err");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Guardando...";

      const { error } = await supabase.auth.updateUser({ password });

      if(error){
        show("No se pudo cambiar la contraseña: " + error.message, "err");
        btn.disabled = false;
        btn.textContent = "Guardar nueva contraseña";
        return;
      }

      show("Contraseña actualizada correctamente. Ya podés cerrar esta página y usar la nueva contraseña en VPLuy.", "ok");
      form.reset();
      btn.textContent = "Contraseña actualizada";
    });

    prepareSession();
  </script>
</body>
</html>
